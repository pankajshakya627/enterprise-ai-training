[project]
name = "nexaassist"
version = "0.1.0"
description = "NexaAssist: enterprise policy and compliance RAG (Phase 1)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ddtrace",
    "langchain-core",
    "langchain-mongodb",
    "langchain-openai",
    "langchain-text-splitters>=1.1.3",
    "pdfplumber",
    "pydantic>=2",
    "pydantic-settings",
    "pymongo",
    "structlog",
    "unstructured[md]",
]

[dependency-groups]
dev = [
    "ipykernel",
    "mongomock>=4.3.0",
    "mypy",
    "nbclient>=0.11.0",
    "pytest",
    "python-dotenv",
    "ruff",
    "tiktoken>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb", "notebooks", "nexa_synthetic_data"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
